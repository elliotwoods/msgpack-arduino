# Configuration for tests

[env:test]
platform = native

build_flags = -std=gnu++17
lib_deps =
    https://github.com/elliotwoods/ArduinoFake.git
test_transport = custom
test_build_project_src = yes

test_ignore = 

debug_test = test_cobs_file
debug_build_flags = -O0 -g -ggdb3

# Tests that need no Arduino at all.
#
# The `test` environment above builds against ArduinoFake, whose vendored `fakeit.hpp` no longer
# compiles under current clang -- so every test in it errors before it runs, and has for a while.
# This environment builds the same library sources on the **non-Arduino** path (`NotArduino.hpp`,
# which is also the path embedded firmware without the Arduino core uses), needs no dependency
# beyond Unity, and therefore actually runs.
#
# `test/native_platform.cpp` supplies the two symbols that path declares and does not define.
[env:native]
platform = native
build_flags =
    -std=gnu++14
    -Isrc
test_build_project_src = yes
test_ignore = test_cobs_file, test_cobs_ones, test_cobs_random, test_cobs_zeros, test_hello_world
